# Pinned inputs for the HackBerry custom kernel. Sourced by build.sh/install.sh.
# Bump KERNEL_SHA deliberately (build.sh --update prints the new tip), then re-run
# the validation checklist in ../KERNEL_PLAN.md.

KERNEL_REPO="https://github.com/raspberrypi/linux"
KERNEL_BRANCH="rpi-7.3.y"
# raspberrypi/linux rpi-7.3.y, 2026-11-24 (rebased dev branch, not LTS; 6.18 is on main)
KERNEL_SHA="99dc5c58063750a5cb675d9f15cd074036e2d72e"

# Must NOT contain "-rpi-": Debian's raspi-firmware kernel hook keys off that
# string and would otherwise overwrite /boot/firmware/kernel_2712.img (the
# fallback kernel). Without it the hook warns and leaves /boot/firmware alone.
KERNEL_LOCALVERSION="-hackberry-2712"

# Directory under /boot/firmware holding the new kernel, initramfs, dtbs,
# overlays and cmdline.txt. Selected with os_prefix= in config.txt.
BOOT_PREFIX="hb73"
